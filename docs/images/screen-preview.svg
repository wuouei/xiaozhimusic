<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <rect width="620" height="360" fill="#14171A"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#EDEDED">1.54 英寸 240×240 界面效果（歌词面板随屏幕高度自适应）</text>

  <!-- 左：歌名阶段 -->
  <g transform="translate(40,56)">
    <rect width="240" height="240" rx="8" fill="#0B0D10" stroke="#3A3F46"/>
    <rect x="0" y="0" width="240" height="22" fill="#15181C"/>
    <circle cx="16" cy="11" r="4" fill="#4EA6DC"/>
    <text x="26" y="15" font-size="11" fill="#8A9099">已连接</text>
    <text x="200" y="15" font-size="11" fill="#8A9099">80%</text>
    <circle cx="120" cy="86" r="30" fill="#1E2227" stroke="#3A3F46"/>
    <text x="103" y="91" font-size="11" fill="#6E7681">emoji</text>
    <rect x="6" y="124" width="228" height="110" rx="10" fill="#000000" opacity="0.9"/>
    <text x="120" y="141" font-size="11" fill="#9E9E9E" text-anchor="middle">晴天 - 周杰伦</text>
    <text x="120" y="165" font-size="12" fill="#7A7A7A" text-anchor="middle">从前从前有个人爱你很久</text>
    <text x="120" y="188" font-size="13" fill="#FFB347" text-anchor="middle">故事的小黄花</text>
    <text x="120" y="206" font-size="13" fill="#FFB347" text-anchor="middle">从出生那年就飘着</text>
    <text x="120" y="228" font-size="12" fill="#7A7A7A" text-anchor="middle">童年的荡秋千</text>
    <text x="0" y="256" font-size="11" fill="#5F6670">面板 110px（含歌名，显示 4 秒）</text>
  </g>

  <!-- 右：歌词阶段 -->
  <g transform="translate(340,56)">
    <rect width="240" height="240" rx="8" fill="#0B0D10" stroke="#3A3F46"/>
    <rect x="0" y="0" width="240" height="22" fill="#15181C"/>
    <circle cx="16" cy="11" r="4" fill="#4EA6DC"/>
    <text x="26" y="15" font-size="11" fill="#8A9099">已连接</text>
    <text x="200" y="15" font-size="11" fill="#8A9099">80%</text>
    <circle cx="120" cy="86" r="30" fill="#1E2227" stroke="#3A3F46"/>
    <text x="103" y="91" font-size="11" fill="#6E7681">emoji</text>
    <rect x="6" y="144" width="228" height="90" rx="10" fill="#000000" opacity="0.9"/>
    <text x="120" y="163" font-size="12" fill="#7A7A7A" text-anchor="middle">从前从前有个人爱你很久</text>
    <text x="120" y="188" font-size="13" fill="#FFB347" text-anchor="middle">故事的小黄花</text>
    <text x="120" y="206" font-size="13" fill="#FFB347" text-anchor="middle">从出生那年就飘着</text>
    <text x="120" y="226" font-size="12" fill="#7A7A7A" text-anchor="middle">童年的荡秋千</text>
    <text x="0" y="256" font-size="11" fill="#5F6670">面板 90px（歌名已隐藏，歌词居中）</text>
  </g>
</svg>
